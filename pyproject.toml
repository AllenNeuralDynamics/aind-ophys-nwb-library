[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-nwb-library"
description = "NWB packaging of AIND planar-ophys pipeline outputs"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.2"

dependencies = [
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.2.0",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@v0.3.1",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/log-schema.git@f09685e#subdirectory=python",
    "aind-nwb-utils==0.2.10",
    "aind-behavior-utils==0.3.4",
    "pynwb==4.1.0",
    "hdmf==6.1.0",
    "hdmf-zarr==0.13.0",
    "h5py==3.16.0",
    "numpy==2.2.6",
    "sparse==0.17.0",
    "matplotlib==3.10.9",
    "pydantic==2.14.2",
    "pydantic-settings==2.14.2",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/aind-ophys-nwb-library"

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'imageio',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = ["*__init__*", "*/aind_ophys_nwb_library/nwb_builders.py", "*/aind_ophys_nwb_library/job.py"]
source = ["aind_ophys_nwb_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 100
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
